<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mbira Learning - Complete Course</title>
    
   
    <link rel="stylesheet" href="beginner-clean.css">
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,700;1,400&family=Noto+Sans:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Mobile Header -->
    <div class="mobile-header">
        <span class="mobile-title">Mbira Learning</span>
        <button id="mobile-menu-btn" class="mobile-menu-btn">☰</button>
    </div>

    <!-- Main Layout -->
    <div class="main-layout">
        
        <!-- Sidebar Navigation -->
        <nav id="sidebar" class="sidebar">
            
            <!-- Sidebar Header -->
            <div class="sidebar-header">
                <h1 class="sidebar-main-title">Mbira</h1>
                <p class="sidebar-subtitle">Complete Course</p>
            </div>

            <!-- Progress Section -->
            <div class="progress-section">
                <h3 class="progress-title">Your Journey</h3>
                
                <div class="chart-container">
                    <canvas id="progressChart"></canvas>
                </div>
                
                <p class="progress-text">
                    <span id="progress-text" class="progress-percentage">0%</span> Complete
                </p>
            </div>

            <!-- Modules List -->
            <div class="modules-list" id="module-list">
                <!-- Content Injected via JavaScript -->
            </div>
            
        </nav>

        <!-- Main Content Area -->
        <main class="content-area">
            
            <!-- Header -->
            <header class="content-header">
                <div class="header-text">
                    <nav class="breadcrumbs" id="breadcrumbs">Home > Introduction</nav>
                    <h2 class="page-title" id="main-title">Welcome</h2>
                </div>
                <div class="nav-buttons">
                    <button id="prev-btn" class="nav-btn" title="Previous Lesson">←</button>
                    <button id="next-btn" class="nav-btn" title="Next Lesson">→</button>
                </div>
            </header>

            <!-- Content Scroll Area -->
            <div id="content-scroller" class="content-scroller">
                
                <!-- Dynamic Lesson Content -->
                <div id="lesson-container" class="lesson-container">
                    <!-- Injected via JavaScript -->
                </div>

            </div>

        </main>
        
    </div>

    <!-- JavaScript -->
    <script src="beginner-clean.js"></script>
    
</body>
</html>
