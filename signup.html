<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Ubuntu</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .form-box {
            max-width: 400px;
            margin: 50px auto;
            padding: 30px;
            background: #f9f9f9;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        /* Style to show red border if invalid */
        input:invalid {
            border-color: #ffdddd;
        }
        .auth-switch {
            margin-top: 20px;
            text-align: center;
            font-size: 0.9rem;
        }
        .auth-switch a {
            color: var(--accent); 
            font-weight: bold;
            text-decoration: none;
        }
        .auth-switch a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="logo">Ubuntu</a>
    </header>

    <div class="container">
        <div class="form-box">
            <h2 class="section-title">Create Account</h2>
            
            <form action="register.php" method="POST">
                <label>Username</label>
                <input type="text" name="username" required>

                  <label for="email">Email:</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="Enter your email" 
                        required 
                        pattern="[^@\s]+@[^@\s]+\.[^@\s]+">
                    <small id="email-error" class="error-message"></small>

                <label>Password</label>
                <input type="password" name="password" id="password"
                    required
                    minlength="8"
                    pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z])(?=.*[^\w]).{8,}"
                    title="Must contain at least one number and one uppercase and lowercase letter, and at least 8 or more characters"
                    placeholder="Min 8 chars, 1 number, 1 symbol">
                
                <p style="font-size: 0.8rem; color: #666; margin-top: 5px;">
                    * Password must be 8+ chars, include a number, uppercase letter, and a symbol.
                </p>

                <label>Confirm Password</label>
                <input type="password" name="confirm_password" id="confirm_password" 
                       required placeholder="Type password again">

                <button type="submit" class="btn btn-primary" style="width:100%">Sign Up</button>
            </form>

            <div class="auth-switch">
                <p>Already have an account? <a href="login.html">Log In</a></p>
            </div>

        </div>
    </div>

    <script>
        const password = document.getElementById("password");
        const confirm_password = document.getElementById("confirm_password");

        function validatePassword(){
            if(confirm_password.value && password.value !== confirm_password.value) {
                confirm_password.setCustomValidity("Passwords Don't Match");
                confirm_password.style.borderColor = "red";
            } else {
                confirm_password.setCustomValidity('');
                confirm_password.style.borderColor = "#ccc";
                if(confirm_password.value) confirm_password.style.borderColor = "green";
            }
        }

        password.onchange = validatePassword;
        confirm_password.onkeyup = validatePassword;
    </script>
</body>
</html>
